<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | IYANZA</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root{--accent:#635bff;--ink:#0b1220;--muted:#667085;--bg:#f7f9fc;--line:#e5e7eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.65 Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:56px 48px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(15,23,42,.08)}
  .logo{display:inline-flex;align-items:center;gap:10px;font-weight:850;font-size:18px;letter-spacing:-.03em;margin-bottom:36px;text-decoration:none;color:var(--ink)}
  .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#635bff,#13b8a6);display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px}
  .logo-text{background:linear-gradient(100deg,#0b1220 30%,#635bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .code{font-size:80px;font-weight:900;letter-spacing:-.06em;line-height:1;background:linear-gradient(135deg,#635bff,#13b8a6);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:24px;font-weight:750;margin:12px 0 8px;letter-spacing:-.03em}
  p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:28px}
  a.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;text-decoration:none;border-radius:11px;padding:12px 22px;font-size:13px;font-weight:750;transition:.2s}
  a.btn:hover{background:#1a2640;transform:translateY(-1px);box-shadow:0 8px 22px rgba(15,23,42,.12)}
</style>
</head>
<body>
<div class="card">
  <a class="logo" href="/">
    <span class="mark">IY</span>
    <span class="logo-text">IYANZA</span>
  </a>
  <div class="code" aria-label="Error 404">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</p>
  <a class="btn" href="/">← Go back home</a>
</div>
</body>
</html>
